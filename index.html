<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15171c">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Limber</title>
<style>
:root { --bg:#15171c; --card:#1f232b; --card2:#282d37; --line:#343a46; --text:#e8eaef; --dim:#8d94a3; --acc:#5fd38d; --acc2:#2c5e41; --warn:#f0b35a; }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { margin:0; background:var(--bg); color:var(--text); font:16px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
body { padding:calc(12px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom)); max-width:560px; margin:0 auto; }
button { font:inherit; color:inherit; background:var(--card2); border:1px solid var(--line); border-radius:10px; padding:8px 14px; cursor:pointer; }
button.pri { background:var(--acc); color:#0d1a12; border-color:var(--acc); font-weight:600; }
button.ghost { background:none; border-color:transparent; color:var(--dim); }
header { display:flex; align-items:center; gap:12px; margin-bottom:14px; }
header h1 { font-size:20px; margin:0; flex:1; }
header .date { color:var(--dim); font-size:13px; font-weight:400; display:block; }
.ring { position:relative; width:54px; height:54px; flex:none; }
.ring svg { transform:rotate(-90deg); }
.ring span { position:absolute; inset:0; display:grid; place-items:center; font-size:13px; font-weight:600; }
.streak { text-align:center; font-size:12px; color:var(--dim); min-width:48px; }
.streak b { display:block; font-size:20px; color:var(--warn); }
.list { display:flex; flex-direction:column; gap:10px; }
.ex { display:flex; align-items:center; gap:12px; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 12px 12px 14px; transition:background .2s,border-color .2s; }
.ex.done { background:#18261e; border-color:var(--acc2); }
.ex .info { flex:1; min-width:0; }
.ex .name { font-weight:600; }
.ex.done .name { color:var(--acc); }
.ex .tgt { color:var(--dim); font-size:14px; }
.ex .note { color:var(--dim); font-size:12px; margin-top:2px; }
.chk { width:44px; height:44px; flex:none; border-radius:50%; border:2px solid var(--line); background:none; padding:0; display:grid; place-items:center; font-size:20px; color:var(--acc); }
.ex.done .chk { background:var(--acc); border-color:var(--acc); color:#0d1a12; }
.chk.part { border-color:var(--acc); font-size:13px; font-weight:700; }
.go { padding:8px 12px; }
.chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
.chip { padding:3px 10px; border-radius:999px; font-size:14px; background:var(--acc2); border:1px solid var(--acc2); color:var(--text); }
.chip.rec { border-color:var(--warn); }
.hist { color:var(--dim); font-size:12px; margin-top:4px; }
.step { display:flex; align-items:center; gap:10px; justify-content:center; margin:10px 0; }
.step button { width:52px; height:52px; border-radius:50%; font-size:24px; padding:0; }
.step input { font:inherit; font-size:34px; font-weight:700; width:110px; text-align:center; color:var(--text); background:var(--card); border:1px solid var(--line); border-radius:12px; padding:6px; }
.step .u { color:var(--dim); width:40px; }
.slab { text-align:center; color:var(--warn); margin-top:6px; }
.sbtns { display:flex; gap:10px; margin-top:16px; }
.sbtns .pri { flex:1; }
.all-done { text-align:center; margin:18px 0 4px; color:var(--acc); font-weight:600; min-height:1.4em; }
h2 { font-size:14px; color:var(--dim); font-weight:600; margin:26px 0 10px; text-transform:uppercase; letter-spacing:.05em; }
.cal { display:grid; grid-template-columns:repeat(7,1fr); gap:5px; }
.cal div { aspect-ratio:1; border-radius:6px; background:var(--card); display:grid; place-items:center; font-size:11px; color:var(--dim); }
.cal .full { background:var(--acc); color:#0d1a12; font-weight:600; }
.cal .part { background:var(--acc2); color:var(--text); }
.cal .today { outline:2px solid var(--text); outline-offset:-2px; }
.cal .fut { background:none; }
.cal .hd { background:none; aspect-ratio:auto; font-size:11px; }
.stats { display:flex; gap:10px; margin-top:12px; }
.stats div { flex:1; background:var(--card); border-radius:10px; padding:8px; text-align:center; font-size:12px; color:var(--dim); }
.stats b { display:block; font-size:18px; color:var(--text); }
.foot { display:flex; justify-content:center; margin-top:22px; }
.lvl { display:flex; align-items:center; gap:10px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:8px 12px; margin-bottom:10px; width:100%; text-align:left; }
.lvl b { color:var(--warn); white-space:nowrap; }
.bar { flex:1; height:8px; background:var(--card2); border-radius:4px; overflow:hidden; }
.bar i { display:block; height:100%; background:var(--warn); border-radius:4px; transition:width .5s; }
.lvl small { color:var(--dim); white-space:nowrap; font-size:12px; }
.chal { display:flex; gap:10px; align-items:center; background:#2a2416; border:1px solid #5a4a24; border-radius:12px; padding:10px 12px; margin-bottom:10px; font-size:14px; }
.chal.ok { background:#18261e; border-color:var(--acc2); }
.chal .t { flex:1; }
.chal .xp { color:var(--warn); font-weight:600; white-space:nowrap; }
.pill { font-size:11px; font-weight:600; color:var(--warn); border:1px solid #5a4a24; border-radius:999px; padding:1px 7px; margin-left:6px; vertical-align:2px; }
.streak small { display:block; color:#8fc9ff; }
.cal .frz { background:#1d3346; color:#8fc9ff; }
.float { position:fixed; left:50%; top:40%; transform:translateX(-50%); color:var(--warn); font-weight:800; font-size:26px; z-index:30; pointer-events:none; animation:up 1.2s ease-out forwards; }
@keyframes up { from { opacity:1; transform:translate(-50%,0); } to { opacity:0; transform:translate(-50%,-70px); } }
.badges { display:grid; grid-template-columns:repeat(auto-fill,minmax(96px,1fr)); gap:8px; }
.badge { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:8px 6px; text-align:center; font-size:12px; }
.badge .i { font-size:26px; display:block; }
.badge.off { opacity:.55; }
.badge .bar { margin-top:5px; height:5px; }
table.wk { width:100%; border-collapse:collapse; font-size:14px; }
table.wk td, table.wk th { padding:5px 4px; border-bottom:1px solid var(--line); text-align:right; }
table.wk td:first-child, table.wk th:first-child { text-align:left; color:var(--dim); font-weight:400; }
.sheet h4 { margin:18px 0 8px; font-size:13px; color:var(--dim); text-transform:uppercase; letter-spacing:.05em; }
.small { font-size:12px; color:var(--dim); }
/* sheets */
.ov { position:fixed; inset:0; background:rgba(0,0,0,.6); display:flex; align-items:flex-end; justify-content:center; z-index:10; }
.sheet { background:var(--bg); border-top:1px solid var(--line); border-radius:18px 18px 0 0; width:100%; max-width:560px; max-height:92vh; overflow:auto; padding:16px 16px calc(20px + env(safe-area-inset-bottom)); }
.sheet h3 { margin:0 0 12px; display:flex; align-items:center; }
.sheet h3 span { flex:1; }
.ed { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px; margin-bottom:10px; display:grid; gap:8px; }
.ed input[type=text], .ed input[type=number], .ed select { font:inherit; color:var(--text); background:var(--card2); border:1px solid var(--line); border-radius:8px; padding:7px 9px; width:100%; min-width:0; }
.ed .row { display:flex; gap:8px; align-items:center; }
.ed .row > * { flex:1; }
.ed label { font-size:12px; color:var(--dim); display:grid; gap:3px; }
.ed .ctl { display:flex; gap:6px; justify-content:flex-end; }
.ed .ctl button { padding:5px 10px; }
.ed .cb { display:flex; align-items:center; gap:6px; font-size:14px; color:var(--text); flex:none; }
/* timer */
.timer { position:fixed; inset:0; background:var(--bg); z-index:20; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; padding:24px; text-align:center; }
.timer .tn { font-size:22px; font-weight:600; }
.timer .side { color:var(--warn); font-size:18px; min-height:1.3em; }
.timer .big { font-size:96px; font-weight:700; font-variant-numeric:tabular-nums; line-height:1; }
.timer .ph { color:var(--dim); min-height:1.3em; }
.timer .btns { display:flex; gap:12px; }
.timer.prep .big { color:var(--dim); }
.timer.run .big { color:var(--acc); }
.timer.over .big { color:var(--warn); }
.toast { position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom)); transform:translateX(-50%); background:var(--card2); border:1px solid var(--line); padding:10px 16px; border-radius:12px; z-index:30; display:flex; gap:12px; align-items:center; }
.cel { position:fixed; inset:0; display:grid; place-items:center; z-index:25; pointer-events:none; }
.cel div { background:var(--card); border:2px solid var(--acc); border-radius:18px; padding:22px 30px; text-align:center; font-size:20px; font-weight:700; animation:pop .4s ease-out; }
.cel small { display:block; font-size:14px; color:var(--dim); font-weight:400; margin-top:6px; }
@keyframes pop { from { transform:scale(.6); opacity:0; } to { transform:scale(1); opacity:1; } }
</style>
</head>
<body>
<header>
  <div class="ring" id="ring"></div>
  <h1>Limber<span class="date" id="date"></span></h1>
  <div class="streak" id="streak"></div>
</header>
<button class="lvl" id="lvl"></button>
<div id="chal"></div>
<div class="list" id="list"></div>
<div class="all-done" id="allDone"></div>
<h2>Last 5 weeks</h2>
<div class="cal" id="cal"></div>
<div class="stats" id="stats"></div>
<div class="foot"><button class="ghost" id="editBtn">✎ Edit exercises</button></div>

<script>
'use strict';
const KEY = 'limber.v1';
const DEFAULTS = [
  { name: 'Plank', kind: 'time', target: 60, sets: 1, sides: false, note: '' },
  { name: 'Side plank', kind: 'time', target: 30, sets: 1, sides: true, note: '' },
  { name: 'Shoulder strength', kind: 'reps', target: 12, sets: 2, sides: false, note: 'e.g. band external rotations' },
  { name: 'Push-ups', kind: 'reps', target: 15, sets: 1, sides: false, note: '' },
  { name: 'Ankle rises', kind: 'reps', target: 20, sets: 1, sides: false, note: '' },
  { name: 'Hip flexibility', kind: 'time', target: 45, sets: 1, sides: true, note: 'e.g. kneeling hip-flexor stretch' },
];
const uid = () => Math.random().toString(36).slice(2, 9);
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// S = { ex: [{id, name, kind:'reps'|'time', target (reps or seconds), sets, sides, note}],
//       log: { 'YYYY-MM-DD': { d: {exId: setsDone}, v: {exId: [entry per set]}, n: exercises on the list that day, full: bool } } }
// entry = {n} (reps or seconds) or {l, r} for each-side exercises. Days logged before entries existed have only d.
// Game (2026-11-07): day log also has t: {exId: target when logged}, up: {exId: target before a level-up made that day},
// ch: the day's challenge {id, kind: 'plus'|'set', v}. Exercises carry lvl (1+) and auto (false = never raise the target).
// S.goal = weekly goal (full days), S.seen = badge ids already announced, S.lvlSeen = player level already announced.
// XP, levels, streak freezes and badges are all DERIVED from the log, never stored.
let S;
function load() {
  try { S = JSON.parse(localStorage.getItem(KEY)); } catch (e) { S = null; }
  if (!S || !Array.isArray(S.ex)) S = { ex: DEFAULTS.map(x => ({ id: uid(), ...x })), log: {} };
  S.log = S.log || {};
  if (S.dayMin == null) { S.dayMin = 4; recountDays(); } // 2026-11-08: a day counts with 4 exercises done, not all of them
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

const dayKey = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const today = () => dayKey(new Date());
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const fmtT = s => s >= 60 ? `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}` : `${s} s`;
function tgtText(x) {
  const one = x.kind === 'time' ? fmtT(x.target) : `${x.target} reps`;
  return (x.sets > 1 ? `${x.sets} × ${one}` : one) + (x.sides ? ' each side' : '');
}
function dayLog(k) { return S.log[k] || (S.log[k] = { d: {}, n: S.ex.length, full: false }); }
const setsDone = (k, id) => (S.log[k] && S.log[k].d[id]) || 0;
const isDone = (k, x) => setsDone(k, x.id) >= x.sets;
const entries = (k, id) => (S.log[k] && S.log[k].v && S.log[k].v[id]) || [];
const eVal = e => e.n != null ? e.n : Math.min(e.l, e.r); // an each-side set counts by its weaker side
const eText = (x, e) => {
  const f = v => x.kind === 'time' ? fmtT(v).replace(' s', 's') : v;
  return e.n != null ? String(f(e.n)) : `L ${f(e.l)} · R ${f(e.r)}`;
};
function bestBefore(id, before) { // best single set on any day (only days before `before`, if given)
  let b = 0;
  for (const [dk, L] of Object.entries(S.log)) if (!before || dk < before) (L.v && L.v[id] || []).forEach(e => { b = Math.max(b, eVal(e)); });
  return b;
}
function lastDay(id) { // most recent earlier day's entries
  const ks = Object.keys(S.log).filter(k => k < today() && S.log[k].v && S.log[k].v[id] && S.log[k].v[id].length).sort();
  return ks.length ? S.log[ks[ks.length - 1]].v[id] : null;
}
// A day is "full" (counts for streaks, goals, calendar) once S.dayMin exercises are done (all of them if the list is shorter).
const dayMin = () => S.dayMin || 4;
const doneCount = L => Object.entries(L.d || {}).filter(([id, n]) => n >= ((S.ex.find(x => x.id === id) || {}).sets || 1)).length;
const fullOf = L => { const need = Math.min(dayMin(), L.n || S.ex.length); return need > 0 && doneCount(L) >= need; };
const sweepOf = L => !!L && L.n > 0 && doneCount(L) >= L.n; // every exercise done
function recountDays() { for (const L of Object.values(S.log)) L.full = fullOf(L); } // after the rule changes
function refreshFull(k) {
  const L = dayLog(k);
  L.n = S.ex.length;
  L.full = fullOf(L);
  if (!Object.keys(L.d).length && !L.ch) delete S.log[k];
  return L.full;
}
// ---- game ----
const stepOf = x => x.kind === 'time' ? 5 : 1;
const exById = id => S.ex.find(x => x.id === id);
const tgtOn = (k, x) => (S.log[k] && S.log[k].t && S.log[k].t[x.id] != null) ? S.log[k].t[x.id] : x.target;
const metOn = (k, x, tgt) => { const es = entries(k, x.id); return es.length >= x.sets && es.filter(e => eVal(e) >= tgt).length >= x.sets; };
const loggedDays = id => Object.keys(S.log).filter(k => entries(k, id).length).sort(); // days with numbers for this exercise
function streakRun(x) { // most recent logged days in a row that met today's target (at that target), capped at 3
  let n = 0;
  for (const k of loggedDays(x.id).reverse()) { if (tgtOn(k, x) === x.target && metOn(k, x, x.target)) { if (++n >= 3) break; } else break; }
  return n;
}
// Rising targets: meet the target (every set) on 3 logged days running -> target goes up one step, level +1.
// Undoing today's sets takes the level-up back.
function checkLevelUp(k) {
  const L = dayLog(k), ups = [];
  L.up = L.up || {};
  for (const x of S.ex) {
    if (L.up[x.id] != null) {
      const old = L.up[x.id];
      const prior = loggedDays(x.id).filter(d => d < k).slice(-2);
      if (!(metOn(k, x, old) && prior.length === 2 && prior.every(d => tgtOn(d, x) === old && metOn(d, x, old)))) {
        x.target = old; x.lvl = Math.max(1, (x.lvl || 1) - 1); delete L.up[x.id];
      }
      continue;
    }
    if (x.auto === false || !entries(k, x.id).length || tgtOn(k, x) !== x.target) continue;
    const days = loggedDays(x.id).filter(d => d <= k).slice(-3);
    if (days.length === 3 && days[2] === k && days.every(d => tgtOn(d, x) === x.target && metOn(d, x, x.target))) {
      L.up[x.id] = x.target; x.target += stepOf(x); x.lvl = (x.lvl || 1) + 1; ups.push(x);
    }
  }
  if (!Object.keys(L.up).length) delete L.up;
  return ups;
}
// Daily challenge, picked once per day from the date
function rng(seed) { let h = 2166136261; for (const c of seed) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return () => ((h = Math.imul(h ^ (h >>> 15), 2246822507) ^ Math.imul(h ^ (h >>> 13), 3266489909)) >>> 0) / 4294967296; }
function ensureChallenge(k) {
  if ((S.log[k] && S.log[k].ch) || !S.ex.length) return;
  const r = rng(k), x = S.ex[Math.floor(r() * S.ex.length)];
  const ch = r() < 0.7 ? { id: x.id, kind: 'plus', v: x.target + (x.kind === 'time' ? 10 : 3) } : { id: x.id, kind: 'set', v: x.sets + 1 };
  dayLog(k).ch = ch; save();
}
function chalText(ch) {
  const x = exById(ch.id); if (!x) return '';
  if (ch.kind === 'set') return `Do ${ch.v} sets of ${x.name} (one extra)`;
  return `One set of ${x.name}: ${x.kind === 'time' ? fmtT(ch.v) : ch.v + ' reps'}${x.sides ? ' each side' : ''}`;
}
function chalDone(k) {
  const L = S.log[k], ch = L && L.ch; if (!ch || !exById(ch.id)) return false;
  const es = entries(k, ch.id);
  return ch.kind === 'set' ? es.length >= ch.v : es.some(e => eVal(e) >= ch.v);
}
// XP for one day (derived from what was logged)
const XP = { set: 5, target: 5, best: 20, full: 25, sweep: 15, chal: 30, levelUp: 40, week: 50, badge: 50 };
function dayXp(k) {
  const L = S.log[k]; if (!L) return 0;
  let xp = 0;
  if (!L.v) xp += XP.set * Object.values(L.d).reduce((a, b) => a + b, 0);
  else for (const [id, es] of Object.entries(L.v)) {
    const x = exById(id) || { kind: 'reps', target: 0 }, tgt = L.t && L.t[id] != null ? L.t[id] : x.target;
    for (const e of es) {
      xp += XP.set;
      const v = eVal(e);
      if (tgt && v >= tgt) xp += XP.target + Math.min(10, Math.floor((v - tgt) / stepOf(x)));
      if (e.rec) xp += XP.best;
    }
  }
  if (L.full) xp += XP.full;
  if (sweepOf(L)) xp += XP.sweep;
  if (chalDone(k)) xp += XP.chal;
  xp += XP.levelUp * Object.keys(L.up || {}).length;
  return xp;
}
// Streak with freezes: every 7 full days in a streak earns a freeze (max 2); a missed day uses one instead of breaking the streak.
function sim() {
  const ks = Object.keys(S.log).filter(k => S.log[k].full).sort(), t = today();
  const G = { streak: 0, best: 0, freezes: 0, frozen: new Set() };
  if (!ks.length) return G;
  let run = 0, cnt = 0, fz = 0;
  for (let d = new Date(ks[0] + 'T12:00'); dayKey(d) <= t; d = addDays(d, 1)) {
    const k = dayKey(d), full = (S.log[k] || {}).full;
    if (full) { run++; if (++cnt >= 7) { cnt = 0; fz = Math.min(2, fz + 1); } }
    else if (k === t) {} // today isn't over yet
    else if (run > 0 && fz > 0) { fz--; G.frozen.add(k); }
    else { run = 0; cnt = 0; }
    G.best = Math.max(G.best, run);
  }
  G.streak = run; G.freezes = fz;
  return G;
}
const weekStart = d => { const x = new Date(d); x.setHours(12, 0, 0, 0); return addDays(x, -((x.getDay() + 6) % 7)); };
const goal = () => S.goal || 5;
function weekStats(ws) {
  const w = { full: 0, sets: 0, reps: 0, secs: 0, bests: 0, xp: 0 };
  for (let i = 0; i < 7; i++) {
    const k = dayKey(addDays(ws, i)), L = S.log[k]; if (!L) continue;
    if (L.full) w.full++;
    w.xp += dayXp(k);
    for (const [id, es] of Object.entries(L.v || {})) {
      const x = exById(id) || {};
      for (const e of es) { w.sets++; if (e.rec) w.bests++; const tot = e.n != null ? e.n : e.l + e.r; if (x.kind === 'time') w.secs += tot; else w.reps += tot; }
    }
    if (!L.v) w.sets += Object.values(L.d).reduce((a, b) => a + b, 0);
  }
  return w;
}
function weeksMet() { // weeks (Mon-Sun) that reached the goal
  const ks = Object.keys(S.log).filter(k => S.log[k].full);
  const by = {}; ks.forEach(k => { const w = dayKey(weekStart(new Date(k + 'T12:00'))); by[w] = (by[w] || 0) + 1; });
  return Object.values(by).filter(n => n >= goal()).length;
}
// Badges: series of thresholds; earned = cur >= need
const fmtDur = s => s >= 3600 ? `${+(s / 3600).toFixed(1)} h` : `${Math.round(s / 60)} min`;
function badges() {
  const G = sim(), out = [];
  const series = (key, icon, cur, needs, name) => needs.forEach(n => out.push({ id: `${key}-${n}`, icon, cur, need: n, name: name(n), key }));

let T = null;

    <div class="btns"><button id="tStop">Stop</button><button class="pri" id="tDone">Done ✓</button></div>`;
  document.body.appendChild(el);

  try { navigator.wakeLock && navigator.wakeLock.request('screen').then(w => { if (T) T.wl = w; }).catch(() => {}); } catch (e) {}

      <h4>Badges · ${got.length}</h4>
      <div class="badges">${got.map(b => `<div class="badge"><span class="i">${b.icon}</span>${esc(b.name)}</div>`).join('') || '<div class="small">None yet – finish a full day for the first.</div>'}</div>
      <h4>Next up</h4>
      <div class="badges">${next.slice(0, 9).map(b => `<div class="badge off"><span class="i">${b.icon}</span>${esc(b.name)}<span class="bar"><i style="width:${Math.min(100, 100 * b.cur / b.need)}%"></i></span></div>`).join('')}</div>
    </div>`;
  };
  ov.addEventListener('click', e => {
    if (e.target === ov) return ov.remove();
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.a === 'close') return ov.remove();
    if (b.dataset.m) { S.dayMin = Math.max(1, Math.min(Math.max(1, S.ex.length), dayMin() + +b.dataset.m)); recountDays(); save(); render(); paint(); }
    if (b.dataset.g) { S.goal = Math.max(1, Math.min(7, goal() + +b.dataset.g)); save(); render(); paint(); }
  });
  paint();
  document.body.appendChild(ov);
}

// ---- edit ----
$('editBtn').onclick = openEdit;
function openEdit() {
  const ov = document.createElement('div'); ov.className = 'ov';
  const draft = S.ex.map(x => ({ ...x }));
  const paint = () => {
    ov.innerHTML = `<div class="sheet"><h3><span>Exercises</span><button class="ghost" data-a="cancel">Cancel</button><button class="pri" data-a="save">Save</button></h3>
      ${draft.map((x, i) => `<div class="ed" data-i="${i}">
        <input type="text" data-f="name" value="${esc(x.name)}" placeholder="Name">
        <div class="row">
          <select data-f="kind"><option value="reps"${x.kind === 'reps' ? ' selected' : ''}>Reps</option><option value="time"${x.kind === 'time' ? ' selected' : ''}>Seconds</option></select>
          <input type="number" inputmode="numeric" min="1" data-f="target" value="${x.target}" aria-label="Target">
          <label class="cb"><input type="checkbox" data-f="sides"${x.sides ? ' checked' : ''}>Each side</label>
        </div>
        <div class="row"><label>Sets<input type="number" inputmode="numeric" min="1" max="10" data-f="sets" value="${x.sets}"></label>
          <label style="flex:3">Note<input type="text" data-f="note" value="${esc(x.note || '')}" placeholder="optional"></label></div>
        <label class="cb"><input type="checkbox" data-f="auto"${x.auto === false ? '' : ' checked'}>Raise the target after 3 days at target (+${x.kind === 'time' ? '5 s' : '1 rep'})</label>
        <div class="ctl"><button data-a="up"${i ? '' : ' disabled'}>↑</button><button data-a="down"${i < draft.length - 1 ? '' : ' disabled'}>↓</button><button data-a="del">Remove</button></div>
      </div>`).join('')}
      <button data-a="add" style="width:100%">+ Add exercise</button></div>`;
  };
  const read = () => ov.querySelectorAll('.ed').forEach(ed => {
    const x = draft[+ed.dataset.i];
    ed.querySelectorAll('[data-f]').forEach(inp => {
      const f = inp.dataset.f;
      x[f] = inp.type === 'checkbox' ? inp.checked : inp.type === 'number' ? Math.max(1, Math.round(+inp.value) || 1) : inp.value.trim();
    });
  });
  ov.addEventListener('click', e => {
    if (e.target === ov) return ov.remove();
    const b = e.target.closest('button'); if (!b) return;
    const a = b.dataset.a, ed = b.closest('.ed'), i = ed ? +ed.dataset.i : -1;
    read();
    if (a === 'cancel') return ov.remove();
    if (a === 'save') {
      S.ex = draft.filter(x => x.name).map(x => ({ ...x, sets: Math.min(10, x.sets) }));
      const k = today(); if (S.log[k]) { if (S.log[k].ch && !exById(S.log[k].ch.id)) delete S.log[k].ch; refreshFull(k); } // today's tally follows the new list; past days keep theirs
      save(); render(); return ov.remove();
    }
    if (a === 'add') draft.push({ id: uid(), name: '', kind: 'reps', target: 10, sets: 1, sides: false, note: '', auto: true, lvl: 1 });
    if (a === 'del') draft.splice(i, 1);
    if (a === 'up') [draft[i - 1], draft[i]] = [draft[i], draft[i - 1]];
    if (a === 'down') [draft[i + 1], draft[i]] = [draft[i], draft[i + 1]];
    paint();
    if (a === 'add') { const ins = ov.querySelectorAll('.ed input[data-f=name]'); ins[ins.length - 1].focus(); }
  });
  paint();
  document.body.appendChild(ov);
}

load(); save(); render();
setInterval(() => { if (!T && $('date').textContent !== new Date().toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long' })) render(); }, 60000);
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
